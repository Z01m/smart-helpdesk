spring:
  application:
    name: ai-worker

  datasource:
    url: ${AI_WORKER_DB_URL:jdbc:postgresql://localhost:5432/ai_worker}
    username: ${AI_WORKER_DB_USERNAME:helpdesk}
    password: ${AI_WORKER_DB_PASSWORD:helpdesk}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      enable-auto-commit: false
      auto-offset-reset: earliest

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

      acks: all
      retries: 2147483647

      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

    listener:
      ack-mode: manual
      concurrency: ${AI_WORKER_KAFKA_CONCURRENCY:3}

server:
  port: ${AI_WORKER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: debug

ai:
  base-url: ${AI_BASE_URL:http://localhost:11434}
  model: ${AI_MODEL:qwen3:4b}
  embedding-model: ${AI_EMBEDDING_MODEL:nomic-embed-text}

  classification-temperature: ${AI_CLASSIFICATION_TEMPERATURE:0.1}
  answer-temperature: ${AI_ANSWER_TEMPERATURE:0.4}

  classification-top-p: ${AI_CLASSIFICATION_TOP_P:1.0}
  answer-top-p: ${AI_ANSWER_TOP_P:0.9}

knowledge-base:
  base-url: ${KNOWLEDGE_BASE_URL:http://localhost:8083}
  api-key: ${INTERNAL_API_KEY:dev-internal-key}

rag:
  confidence-threshold: ${RAG_CONFIDENCE_THRESHOLD:0.75}
  default-top-k: ${RAG_DEFAULT_TOP_K:5}
