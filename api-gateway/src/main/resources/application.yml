spring:
  application:
    name: api-gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/gateway
    username: helpdesk
    password: helpdesk
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: debug