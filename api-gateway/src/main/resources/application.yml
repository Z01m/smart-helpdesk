spring:
  application:
    name: api-gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/gateway
    username: helpdesk
    password: helpdesk
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  Kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: "your-very-long-secret-key-for-local-development-123456789"
  access-token-expiration: 900000
  refresh-token-expiration: 2592000000