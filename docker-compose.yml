services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: helpdesk-postgres

    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10


  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: helpdesk-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"


  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: helpdesk-kafka

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        EXTERNAL:PLAINTEXT,
        INTERNAL:PLAINTEXT

      KAFKA_LISTENERS: >
        EXTERNAL://0.0.0.0:9092,
        INTERNAL://0.0.0.0:29092

      KAFKA_ADVERTISED_LISTENERS: >
        EXTERNAL://localhost:9092,
        INTERNAL://kafka:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:29092 --list > /dev/null 2>&1"
        ]
      interval: 5s
      timeout: 10s
      retries: 20


  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: helpdesk-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      - /bin/bash
      - -c

    command: >
      "
      echo 'Creating Kafka topics...';

      kafka-topics
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic ticket.created
      --partitions 1
      --replication-factor 1;

      kafka-topics
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic ticket.processed
      --partitions 1
      --replication-factor 1;

      kafka-topics
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic ticket.status-changed
      --partitions 1
      --replication-factor 1;

      kafka-topics
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic ticket.dlq
      --partitions 1
      --replication-factor 1;

      echo 'Kafka topics created successfully';
      "


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: helpdesk-kafka-ui

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      KAFKA_CLUSTERS_0_NAME: smart-helpdesk
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    ports:
      - "8090:8080"


volumes:
  pg_data: