spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  application:
    name: notification-service

  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${NOTIFICATION_DB_USERNAME:helpdesk}
    password: ${NOTIFICATION_DB_PASSWORD:helpdesk}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      enable-auto-commit: false
      auto-offset-reset: earliest

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

    listener:
      ack-mode: manual_immediate
      concurrency: ${NOTIFICATION_KAFKA_CONCURRENCY:3}


server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${NOTIFICATION_SERVICE_PORT:8082}


management:
  health:
    mail:
      enabled: ${EMAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info


logging:
  level:
    org.hibernate.SQL: debug


api-gateway:
  base-url: ${API_GATEWAY_URL:http://localhost:8080}
  api-key: ${INTERNAL_API_KEY:dev-internal-key}

jwt:
  secret: ${JWT_SECRET:your-very-long-secret-key-for-local-development-123456789}
notification:
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${EMAIL_FROM:}
    encryption-key: ${EMAIL_ENCRYPTION_KEY:}
  websocket:
    allowed-origins: ${NOTIFICATION_ALLOWED_ORIGINS:http://localhost:3000}
