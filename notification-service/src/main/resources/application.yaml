spring:
  application:
    name: notification-service

  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${NOTIFICATION_DB_USERNAME:helpdesk}
    password: ${NOTIFICATION_DB_PASSWORD:helpdesk}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      enable-auto-commit: false
      auto-offset-reset: earliest

    listener:
      ack-mode: manual
      concurrency: ${NOTIFICATION_KAFKA_CONCURRENCY:3}


server:
  port: ${NOTIFICATION_SERVICE_PORT:8082}


management:
  endpoints:
    web:
      exposure:
        include: health,info


logging:
  level:
    org.hibernate.SQL: debug


api-gateway:
  base-url: ${API_GATEWAY_URL:http://localhost:8080}
  api-key: ${INTERNAL_API_KEY:dev-internal-key}